name: "Docker Build & Push"
description: "Build and push Docker image"

inputs:
  compose-file:
    description: "Path to the Docker Compose file"
    required: true
  image_tag:     
    description: "Tag to use for the Docker image"
    required: true

  registry:
    description: "Container registry host"
    default: cr.alkhwarizmi.online
  username:
    description: "Registry username"
    required: true
  password:
    description: "Registry password"
    required: true

  services:
    description: "Space-separated compose services to build/push. Empty = all services."
    required: false
    default: ""

  cache_registry:
    description: >-
      Host of a separate registry used only for BuildKit cache (cache_from/cache_to
      in the compose file). Logged in with the same credentials. Empty = cache lives
      on `registry`, so no extra login is needed.
    required: false
    default: ""


runs:
  using: "composite"
  steps:
    # docker-container driver is required for `cache_to: type=registry` in the
    # compose file; the default docker driver cannot export a cache.
    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3

    - name: Docker login
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    # A cache registry on a different host needs its own credentials in the
    # buildx container, or cache_to fails with 401 and the build silently loses
    # its cache (BuildKit never fails a build over a cache write).
    - name: Docker login (cache registry)
      if: inputs.cache_registry != ''
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.cache_registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    # COMPOSE_BAKE routes the build through buildx bake, which is what honours
    # cache_from/cache_to on a compose service.
    #
    # --push uploads straight from the buildx container. A separate `compose push`
    # step would instead force every image to be exported into the local Docker
    # store first, purely so the push could find it -- measured at ~84s of the
    # 225s build on Monitor-System, for images that are then immediately re-packed
    # and uploaded. Building and pushing in one invocation skips that round trip.
    - name: Build and push
      shell: bash
      run: docker compose -f ${{ inputs.compose-file }} build --progress=plain --push ${{ inputs.services }}
      env:
        IMAGE_TAG: ${{ inputs.image_tag }}
        COMPOSE_BAKE: "true"
