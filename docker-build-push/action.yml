name: "Docker Build & Push"
description: "Build and push Docker image"

inputs:
  compose-file:
    description: "Path to the Docker Compose file"
    required: true
  image_tag:     
    description: "Tag to use for the Docker image"
    required: true

  registry:
    description: "Container registry host"
    default: cr.alkhwarizmi.online
  username:
    description: "Registry username"
    required: true
  password:
    description: "Registry password"
    required: true

  services:
    description: "Space-separated compose services to build/push. Empty = all services."
    required: false
    default: ""


runs:
  using: "composite"
  steps:
    # docker-container driver is required for `cache_to: type=registry` in the
    # compose file; the default docker driver cannot export a cache.
    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3

    - name: Docker login
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    # COMPOSE_BAKE routes the build through buildx bake, which is what honours
    # cache_from/cache_to on a compose service. Compose marks the bake targets
    # as loaded, so the images land in the local store for the push step.
    - name: Build
      shell: bash
      run: docker compose -f ${{ inputs.compose-file }} build --progress=plain ${{ inputs.services }}
      env:
        IMAGE_TAG: ${{ inputs.image_tag }}
        COMPOSE_BAKE: "true"

    - name: Push
      shell: bash
      run: docker compose -f ${{ inputs.compose-file }} push ${{ inputs.services }}
      env:
        IMAGE_TAG: ${{ inputs.image_tag }}
