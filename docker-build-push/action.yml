name: "Docker Build & Push"
description: "Build and push Docker image"

inputs:
  compose-file:
    description: "Path to the Docker Compose file"
    required: true
  image_tag:     
    description: "Tag to use for the Docker image"
    required: true

  registry:
    description: "Container registry host"
    default: cr.alkhwarizmi.online
  username:
    description: "Registry username"
    required: true
  password:
    description: "Registry password"
    required: true

  services:
    description: "Space-separated compose services to build/push. Empty = all services."
    required: false
    default: ""

  cache_registry:
    description: >-
      Host of a separate registry used only for BuildKit cache (cache_from/cache_to
      in the compose file). Logged in with the same credentials. Empty = cache lives
      on `registry`, so no extra login is needed.
    required: false
    default: ""


runs:
  using: "composite"
  steps:
    # docker-container driver is required for `cache_to: type=registry` in the
    # compose file; the default docker driver cannot export a cache.
    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3

    # Exports ACTIONS_RUNTIME_TOKEN / ACTIONS_CACHE_URL into the job env, which
    # `cache_to: type=gha` needs. docker/build-push-action injects these itself;
    # bake invoked from a plain shell step does not, so a compose file using
    # type=gha silently fails to export without this. No-op for other cache types.
    - name: Expose GitHub Actions runtime for type=gha cache
      uses: crazy-max/ghaction-github-runtime@v3

    - name: Docker login
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    # A cache registry on a different host needs its own credentials in the
    # buildx container, or cache_to fails with 401 and the build silently loses
    # its cache (BuildKit never fails a build over a cache write).
    - name: Docker login (cache registry)
      if: inputs.cache_registry != ''
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.cache_registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    # bake reads the same compose file (service names are the bake targets) and
    # honours cache_from/cache_to, but unlike `compose build --push` it does not
    # also export each image into the local Docker store. That export was measured
    # at ~47s of a 173s build on Monitor-System -- images unpacked to disk and then
    # immediately re-packed for upload, for no one to read.
    #
    # --allow=fs.read is required because these compose files use `context: ../..`
    # to reach the monorepo root, which escapes the compose file's own directory.
    # bake refuses to read outside that directory without an explicit grant;
    # `compose build` allowed it silently.
    #
    # bake resolves `context:` relative to the working directory, while compose
    # resolves it relative to the compose file. Running from the compose file's
    # own directory makes `context: ../..` mean the same thing to both.
    - name: Build and push
      shell: bash
      run: |
        cd "$(dirname "${{ inputs.compose-file }}")"
        docker buildx bake -f "$(basename "${{ inputs.compose-file }}")" \
          --allow=fs.read=* --progress=plain --push ${{ inputs.services }}
      env:
        IMAGE_TAG: ${{ inputs.image_tag }}
